---
# spinko-sosho build: only the L=trackpad + R=trackball combination plus settings_reset.
include:
  # R side (Central) — trackball
  - board: xiao_ble/nrf52840/zmk
    shield: sosho_R_trackball rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sosho_R_trackball

  # L side (Peripheral) — trackpad
  - board: xiao_ble/nrf52840/zmk
    shield: sosho_L_trackpad rgbled_adapter
    artifact-name: sosho_L_trackpad

  # Settings reset firmware (flash before pairing halves the first time)
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset
